# Knowledge base: ingredient -> source status.
# Statuses: always_animal | always_plant | ambiguous | dairy | egg |
#           fermented_dairy | root_vegetable | allium
# Rule: never guess. If a fact cannot be verified, status is `ambiguous`.
# E-number references point at the stable E-number list; named ingredients
# point at their stable reference article.

